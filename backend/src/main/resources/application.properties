spring.application.name=bar-pos-backend
server.port=${PORT:8080}

# Conexión dinámica (Nube o Docker local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bar_pos_db}
spring.datasource.username=${DB_USER:pos_user}
spring.datasource.password=${DB_PASSWORD:pos_password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false