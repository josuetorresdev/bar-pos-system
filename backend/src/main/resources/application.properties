# Nombre de la aplicación
spring.application.name=bar-pos-backend

# Conexión a PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/bar_pos_db
spring.datasource.username=pos_user
spring.datasource.password=pos_password123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
