services:
  postgres-db:
    image: postgres:16-alpine
    container_name: bar_pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bar_pos_db
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: